[project]
name = "hyperviz-notebooks"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Frank Ligterink", email = "frank.ligterink@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anywidget>=0.11.0",
    "dash>=4.4.1",
    "dash-daq>=0.6.0",
    "dash-leaflet>=1.1.3",
    "dask>=2026.7.1",
    "datashader>=0.19.1",
    "holoviews>=1.23.1",
    "imagecodecs>=2026.6.26",
    "ipyleaflet>=0.20.0",
    "ipywidgets>=8.1.8",
    "jupyter-dash>=0.4.2",
    "localtileserver>=1.0.0",
    "numpy>=2.4.6",
    "panel>=1.9.3",
    "plotly>=6.9.0",
    "rioxarray>=0.23.0",
    "scikit-image>=0.26.0",
    "tomlkit>=0.15.1",
]

[project.scripts]
hyperviz-notebooks = "hyperviz_notebooks:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dash-bootstrap-components>=2.0.4",
    "fairdatanow>=0.2.23",
    "ipykernel>=7.3.0",
    "jupyter-bokeh>=4.1.0",
    "jupytext>=1.19.5",
    "matplotlib>=3.11.1",
    "pip>=26.2.1",
    "plotly>=6.9.0",
]

[tool.jupytext]
formats = "ipynb,py:percent"
